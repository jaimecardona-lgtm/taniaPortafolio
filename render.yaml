services:
  # Un solo Web Service Docker: Nginx público (:$PORT) + FastAPI interno (127.0.0.1:8000)
  - type: web
    name: tania-portafolio
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    pullRequestPreviewsEnabled: false

    envVars:
      - key: OPENROUTER_API_KEY
        sync: false

      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1

      - key: OPENROUTER_SITE_NAME
        value: Tania Pelaez Valverde Portfolio

      - key: CHAT_PRIMARY_LLM
        value: nvidia/nemotron-3.5-lightning:free

      - key: CHAT_FALLBACK_LLM
        value: openrouter/free

      - key: CHAT_USE_FALLBACK
        value: "true"

      - key: CHAT_TEMPERATURE
        value: "0.2"

      - key: CHAT_TOP_P
        value: "0.8"

      - key: CHAT_MAX_TOKENS
        value: "450"

      - key: CHAT_TIMEOUT_MS
        value: "45000"
