services:
  - type: web
    name: tania-portafolio
    runtime: static
    rootDir: portafolio-react
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_CHAT_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: tania-portafolio-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    pullRequestPreviewsEnabled: false

    envVars:
      - key: OPENROUTER_API_KEY
        sync: false

      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1

      - key: OPENROUTER_SITE_URL
        value: https://taniaportafolio.onrender.com

      - key: OPENROUTER_SITE_NAME
        value: Tania Pelaez Valverde Portfolio

      - key: CHAT_PRIMARY_LLM
        value: nvidia/nemotron-3.5-lightning:free

      - key: CHAT_FALLBACK_LLM
        value: openrouter/free

      - key: CHAT_USE_FALLBACK
        value: "true"

      - key: CHAT_TEMPERATURE
        value: "0.2"

      - key: CHAT_TOP_P
        value: "0.8"

      - key: CHAT_MAX_TOKENS
        value: "450"

      - key: CHAT_TIMEOUT_MS
        value: "45000"

      - key: ALLOWED_ORIGINS
        value: "https://taniaportafolio.onrender.com"