# Solo para desarrollo/verificación local. Render NO usa este archivo:
# la imagen es la misma que se despliega en Render (Dockerfile).
services:
  tania-app:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "10000:10000"

    env_file:
      - backend/.env

    environment:
      PORT: "10000"

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:10000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    restart: unless-stopped
